<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Atendimento – Clínica</title>

<style>
body{font-family:Arial;margin:0;background:#f5f7fa}
header{background:#4a90e2;color:#fff;padding:20px;text-align:center;
position:fixed;top:0;width:100%;z-index:1000}
#abas{padding:10px 20px;background:#2980b9;position:fixed;top:70px;width:100%;z-index:999}
#abas button{padding:10px 18px;margin-right:5px;border:0;border-radius:4px;
background:#2980b9;color:#fff;cursor:pointer}
#abas button.ativo{background:#27ae60}
main{padding:150px 20px}
.aba{display:none}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:15px}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:center}
th{background:#eaf0fb}
.status-confirmado{color:#27ae60;font-weight:bold}
.status-cancelado{color:#e74c3c;font-weight:bold}
.status-reagendar{color:#f39c12;font-weight:bold}
.whats-msg{background:#e1ffc7;padding:8px;margin-bottom:6px;border-radius:5px}
button{padding:6px 12px;border-radius:4px;border:0;cursor:pointer}
.btn-confirmar{background:#27ae60;color:#fff}
.btn-whats{background:#3498db;color:#fff}
</style>
</head>

<body>

<header>Painel de Atendimento – Clínica</header>

<div id="abas">
  <button class="ativo" onclick="mostrarAba('agenda',this)">Agenda</button>
  <button onclick="mostrarAba('cadastro',this)">Cadastro</button>
  <button onclick="mostrarAba('profissionais',this)">Profissionais</button>
  <button onclick="mostrarAba('lista',this)">Lista de Pacientes</button>
  <button onclick="mostrarAba('whatsapp',this)">WhatsApp</button>
</div>

<main>

<!-- AGENDA -->
<div id="conteudo-agenda" class="aba">
<table>
<thead>
<tr>
<th>Paciente</th><th>Data</th><th>Hora</th><th>Profissional</th><th>Status</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabela-agenda"></tbody>
</table>
</div>

<!-- CADASTRO -->
<div id="conteudo-cadastro" class="aba">
<form onsubmit="cadastrarPaciente(event)">
Nome: <input id="nome" required><br><br>
Telefone: <input id="telefone" required><br><br>
Data: <input type="date" id="data" required><br><br>
Hora: <input type="time" id="horario" required><br><br>
Profissional:
<select id="select-profissional" required></select><br><br>
<button>Cadastrar</button>
</form>
</div>

<!-- PROFISSIONAIS -->
<div id="conteudo-profissionais" class="aba">
<form onsubmit="adicionarProfissional(event)">
Nome: <input id="nome-prof" required>
Especialidade: <input id="esp-prof" required>
<button>Adicionar</button>
</form>

<table>
<thead><tr><th>Nome</th><th>Especialidade</th></tr></thead>
<tbody id="tabela-profissionais"></tbody>
</table>
</div>

<!-- LISTA -->
<div id="conteudo-lista" class="aba">
<table>
<thead><tr><th>Nome</th><th>Telefone</th><th>Profissional</th></tr></thead>
<tbody id="tabela-lista"></tbody>
</table>
</div>

<!-- WHATSAPP -->
<div id="conteudo-whatsapp" class="aba">
<div id="whats-log"></div>
<input id="resposta" placeholder="Digite a mensagem">
<button onclick="enviarResposta()">Enviar</button>
</div>

</main>

<script>
/* ================= CONFIG ================= */
// 👉 COLE A URL REAL DO SEU MOCKAPI AQUI
const API_BASE = "https://694efba7b5bc648a93c1bd3c.mockapi.io/api/v1";

/* ================= CACHE ================= */
let pacientes = [];
let profissionais = [];
let pacienteSelecionado = null;

/* ================= ABAS ================= */
async function mostrarAba(aba,btn){
 document.querySelectorAll('.aba').forEach(a=>a.style.display='none');
 document.querySelectorAll('#abas button').forEach(b=>b.classList.remove('ativo'));
 btn.classList.add('ativo');
 document.getElementById("conteudo-"+aba).style.display="block";

 if(aba==="agenda" || aba==="lista") await carregarPacientes();
 if(aba==="cadastro" || aba==="profissionais") await carregarProfissionais();
}

/* ================= FETCH ================= */
async function carregarPacientes(){
 const r = await fetch(`${API_BASE}/pacientes`);
 pacientes = await r.json();
 renderAgenda();
 renderLista();
}

async function carregarProfissionais(){
 const r = await fetch(`${API_BASE}/profissionais`);
 profissionais = await r.json();
 renderProfissionais();
}

/* ================= RENDER ================= */
function renderAgenda(){
 const tb = document.getElementById("tabela-agenda");
 tb.innerHTML="";
 pacientes.forEach(p=>{
  tb.innerHTML+=`
  <tr>
    <td>${p.nome}</td>
    <td>${p.data}</td>
    <td>${p.horario}</td>
    <td>${p.profissional}</td>
    <td class="status-${p.status?.toLowerCase()}">${p.status||""}</td>
    <td>
      <button class="btn-confirmar" onclick="enviarConfirmacao('${p.id}')">
        Enviar confirmação
      </button>
      <button class="btn-whats" onclick="abrirWhats('${p.id}')">
        Whats
      </button>
    </td>
  </tr>`;
 });
}

function renderLista(){
 const tb = document.getElementById("tabela-lista");
 tb.innerHTML="";
 pacientes.forEach(p=>{
  tb.innerHTML+=`
   <tr>
    <td>${p.nome}</td>
    <td>${p.telefone}</td>
    <td>${p.profissional}</td>
   </tr>`;
 });
}

function renderProfissionais(){
 const tb = document.getElementById("tabela-profissionais");
 const sel = document.getElementById("select-profissional");
 tb.innerHTML="";
 sel.innerHTML="<option value=''>Selecione</option>";
 profissionais.forEach(p=>{
  tb.innerHTML+=`<tr><td>${p.nome}</td><td>${p.especialidade}</td></tr>`;
  sel.innerHTML+=`<option value="${p.nome}">${p.nome}</option>`;
 });
}

/* ================= CRUD ================= */
async function cadastrarPaciente(e){
 e.preventDefault();

 const paciente = {
  nome: nome.value,
  telefone: telefone.value,
  data: data.value,
  horario: horario.value,
  profissional: document.getElementById("select-profissional").value,
  status: "Aguardando",
  mensagens: []
 };

 await fetch(`${API_BASE}/pacientes`,{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify(paciente)
 });

 mostrarAba('agenda',document.querySelectorAll('#abas button')[0]);
}

async function adicionarProfissional(e){
 e.preventDefault();
 await fetch(`${API_BASE}/profissionais`,{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    nome: document.getElementById("nome-prof").value,
    especialidade: document.getElementById("esp-prof").value
  })
 });
 await carregarProfissionais();
}

/* ================= CONFIRMAÇÃO ================= */
async function enviarConfirmacao(id){
 const p = pacientes.find(x=>x.id===id);
 if(!p) return alert("Paciente não encontrado");

 p.status="Confirmado";
 p.mensagens.push("Clínica: Sua consulta está confirmada.");

 await fetch(`${API_BASE}/pacientes/${id}`,{
  method:"PUT",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify(p)
 });

 await carregarPacientes();
 abrirWhats(id);
}

/* ================= WHATSAPP ================= */
function abrirWhats(id){
 pacienteSelecionado = pacientes.find(p=>p.id===id);
 const log = document.getElementById("whats-log");
 log.innerHTML="";
 pacienteSelecionado.mensagens.forEach(m=>{
  log.innerHTML+=`<div class="whats-msg">${m}</div>`;
 });
 mostrarAba('whatsapp',document.querySelectorAll('#abas button')[4]);
}

async function enviarResposta(){
 if(!pacienteSelecionado) return;
 const msg = resposta.value.trim();
 if(!msg) return;

 pacienteSelecionado.mensagens.push("Clínica: "+msg);

 await fetch(`${API_BASE}/pacientes/${pacienteSelecionado.id}`,{
  method:"PUT",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify(pacienteSelecionado)
 });

 abrirWhats(pacienteSelecionado.id);
 resposta.value="";
}

/* ================= INIT ================= */
mostrarAba('agenda',document.querySelectorAll('#abas button')[0]);
</script>

</body>
</html>
